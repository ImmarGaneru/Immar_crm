version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.2
    commands:
      - echo "Installing dependencies..."
      - curl -sS https://getcomposer.org/installer | php
      - php composer.phar install --no-interaction --prefer-dist --optimize-autoloader
      - cp .env.example .env
      - php artisan key:generate
  build:
    commands:
      - echo "Build complete"
artifacts:
  files:
    - '**/*'
    - '!tests/**'
    - '!node_modules/**'
    - '!storage/**'
